<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gorro — Камень Ножницы Бумага</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; }
    body { background: #0b0c10; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #1f222e; }
    .logo { font-weight: 800; font-size: 17px; color: #00f0ff; }
    .bal { background: #14161f; border: 1px solid #00ff884d; padding: 6px 14px; border-radius: 12px; color: #00ff88; font-weight: 700; }
    .screen { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .screen.active { display: flex; }
    .radar { width: 100px; height: 100px; border-radius: 50%; border: 2px solid #b829ea; display: flex; align-items: center; justify-content: center; font-size: 36px; box-shadow: 0 0 25px #b829ea55; margin-bottom: 20px; animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(0.95); } 50% { transform: scale(1.07); } }
    .duel-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 350px; background: #14161f; padding: 14px 20px; border-radius: 16px; border: 1px solid #ffffff12; margin-bottom: 24px; }
    .p-col { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 38%; }
    .ava { font-size: 32px; background: #1e2130; width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .arena { display: flex; justify-content: space-around; align-items: center; width: 100%; max-width: 340px; height: 130px; background: #14161f; border-radius: 20px; border: 1px solid #00f0ff33; margin-bottom: 24px; font-size: 54px; }
    .choices { display: flex; gap: 12px; width: 100%; max-width: 350px; }
    .c-btn { flex: 1; background: #14161f; border: 2px solid #2a2e3f; border-radius: 18px; padding: 18px 0; font-size: 38px; cursor: pointer; transition: 0.15s; }
    .c-btn:active, .c-btn.picked { border-color: #00f0ff; background: #00f0ff1a; transform: scale(0.95); }
    .btn { width: 100%; max-width: 350px; padding: 16px; border-radius: 14px; border: none; font-size: 16px; font-weight: 800; cursor: pointer; }
    .btn-cyan { background: #00f0ff; color: #05080d; margin-bottom: 10px; }
    .btn-dark { background: transparent; color: #8a8f9e; border: 1px solid #ffffff26; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">✂️ 1V1 КНБ</div>
    <div class="bal" id="bal">10 000</div>
  </div>

  <!-- ПОИСК СОПЕРНИКА -->
  <div class="screen active" id="sSearch">
    <div class="radar">🪨</div>
    <h2 style="margin-bottom:8px">Поиск соперника...</h2>
    <p style="color:#8a8f9e; margin-bottom:24px">Ставка: <b id="betTxt" style="color:#fff">100</b></p>
    <button class="btn btn-dark" style="width:180px" onclick="cancel()">Отменить</button>
  </div>

  <!-- ИГРА И РЕЗУЛЬТАТ -->
  <div class="screen" id="sGame">
    <div class="duel-bar">
      <div class="p-col"><div class="ava" id="myAva">🐯</div><b id="myName" style="font-size:13px">Игрок</b></div>
      <div style="text-align:center"><div style="font-size:11px; color:#8a8f9e">БАНК</div><b id="potTxt" style="color:#00ff88; font-size:17px">190</b></div>
      <div class="p-col"><div class="ava" id="enAva">🐺</div><b id="enName" style="font-size:13px">Бот</b></div>
    </div>

    <div class="arena">
      <div id="myHand">❓</div>
      <div style="font-size:20px; font-weight:900; color:#b829ea">VS</div>
      <div id="enHand">❓</div>
    </div>

    <div id="statusTxt" style="font-size:20px; font-weight:800; margin-bottom:18px; min-height:28px">Сделайте ваш ход!</div>

    <div class="choices" id="choiceBox">
      <button class="c-btn" onclick="pick('rock', '🪨')">🪨</button>
      <button class="c-btn" onclick="pick('scissors', '✂️')">✂️</button>
      <button class="c-btn" onclick="pick('paper', '📄')">📄</button>
    </div>

    <div id="endBtns" style="display:none; width:100%; flex-direction:column; align-items:center;">
      <button class="btn btn-cyan" onclick="start()">СЫГРАТЬ ЕЩЕ</button>
      <button class="btn btn-dark" onclick="location.href='index.html'">В МЕНЮ</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
    let bal = parseInt(localStorage.getItem('demo_balance')) || 10000;
    let wins = parseInt(localStorage.getItem('demo_wins')) || 0;
    let losses = parseInt(localStorage.getItem('demo_losses')) || 0;
    const bet = parseInt(localStorage.getItem('gorro_bet')) || 100;
    const myAva = localStorage.getItem('demo_avatar') || '🐯';
    const myName = tg?.initDataUnsafe?.user?.first_name || 'Игрок';

    const bots = [{ name: 'CyberWolf', ava: '🐺' }, { name: 'Shadow', ava: '🦊' }, { name: 'NeonKing', ava: '🦁' }, { name: 'Viper', ava: '🐍' }];
    const items = [{ id: 'rock', icon: '🪨' }, { id: 'scissors', icon: '✂️' }, { id: 'paper', icon: '📄' }];
    let tSearch, locked = false;

    document.getElementById('myAva').innerText = myAva;
    document.getElementById('myName').innerText = myName;

    function sync() {
      localStorage.setItem('demo_balance', bal);
      localStorage.setItem('demo_wins', wins);
      localStorage.setItem('demo_losses', losses);
      document.getElementById('bal').innerText = bal;
    }

    function start() {
      if (bal < bet) { alert('Недостаточно средств!'); location.href = 'index.html'; return; }
      bal -= bet; sync(); locked = false;
      document.getElementById('betTxt').innerText = bet;
      document.getElementById('sGame').classList.remove('active');
      document.getElementById('sSearch').classList.add('active');

      tSearch = setTimeout(() => {
        const bot = bots[Math.floor(Math.random() * bots.length)];
        document.getElementById('enAva').innerText = bot.ava;
        document.getElementById('enName').innerText = bot.name;
        document.getElementById('potTxt').innerText = Math.floor(bet * 1.9);
        document.getElementById('myHand').innerText = '❓';
        document.getElementById('enHand').innerText = '❓';
        document.getElementById('statusTxt').innerText = 'Сделайте ваш ход!';
        document.getElementById('statusTxt').style.color = '#fff';
        document.getElementById('choiceBox').style.display = 'flex';
        document.getElementById('endBtns').style.display = 'none';
        document.getElementById('sSearch').classList.remove('active');
        document.getElementById('sGame').classList.add('active');
        tg?.HapticFeedback?.impactOccurred('medium');
      }, 2000);
    }

    function cancel() { clearTimeout(tSearch); bal += bet; sync(); location.href = 'index.html'; }

    function pick(myId, myIcon) {
      if (locked) return; locked = true;
      document.getElementById('myHand').innerText = myIcon;
      document.getElementById('enHand').innerText = '⏳';
      document.getElementById('statusTxt').innerText = 'Соперник выбирает...';
      document.getElementById('choiceBox').style.display = 'none';

      setTimeout(() => {
        const botChoice = items[Math.floor(Math.random() * items.length)];
        document.getElementById('enHand').innerText = botChoice.icon;
        const st = document.getElementById('statusTxt');
        const prize = Math.floor(bet * 1.9);

        if (myId === botChoice.id) {
          bal += bet;
          st.innerText = 'НИЧЬЯ! Возврат ставки';
          st.style.color = '#00f0ff';
        } else if (
          (myId === 'rock' && botChoice.id === 'scissors') ||
          (myId === 'scissors' && botChoice.id === 'paper') ||
          (myId === 'paper' && botChoice.id === 'rock')
        ) {
          bal += prize; wins++;
          st.innerText = `ПОБЕДА! +${prize}`;
          st.style.color = '#00ff88';
          tg?.HapticFeedback?.notificationOccurred('success');
        } else {
          losses++;
          st.innerText = `ПОРАЖЕНИЕ! -${bet}`;
          st.style.color = '#ff2a5f';
          tg?.HapticFeedback?.notificationOccurred('error');
        }
        sync();
        document.getElementById('endBtns').style.display = 'flex';
      }, 900);
    }
    sync(); start();
  </script>
</body>
</html>
