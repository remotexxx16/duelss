<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gorro — Сапёр 1V1</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
    body { background: #0b0c10; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #1f222e; }
    .logo { font-weight: 800; font-size: 17px; color: #00f0ff; }
    .bal { background: #14161f; border: 1px solid #00ff884d; padding: 6px 14px; border-radius: 12px; color: #00ff88; font-weight: 700; }
    .screen { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .screen.active { display: flex; }
    .radar { width: 100px; height: 100px; border-radius: 50%; border: 2px solid #ff2a5f; display: flex; align-items: center; justify-content: center; font-size: 36px; box-shadow: 0 0 25px #ff2a5f55; margin-bottom: 20px; animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(0.95); } 50% { transform: scale(1.07); } }
    .duel-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 340px; background: #14161f; padding: 12px 18px; border-radius: 16px; border: 1px solid #ffffff12; margin-bottom: 20px; }
    .p-col { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 38%; }
    .ava { font-size: 28px; background: #1e2130; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 310px; margin-bottom: 24px; }
    .cell { aspect-ratio: 1; background: #14161f; border: 2px solid #2a2e3f; border-radius: 18px; font-size: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.15s; box-shadow: 0 4px 15px #00000040; }
    .cell:active { transform: scale(0.93); }
    .cell.safe-me { border-color: #00ff88; background: #00ff881a; }
    .cell.safe-bot { border-color: #00f0ff; background: #00f0ff1a; }
    .cell.boom { border-color: #ff2a5f; background: #ff2a5f33; box-shadow: 0 0 25px #ff2a5f66; }
    .btn { width: 100%; max-width: 340px; padding: 16px; border-radius: 14px; border: none; font-size: 16px; font-weight: 800; cursor: pointer; }
    .btn-cyan { background: #00f0ff; color: #05080d; margin-bottom: 10px; }
    .btn-dark { background: transparent; color: #8a8f9e; border: 1px solid #ffffff26; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">💣 САПЁР 1V1</div>
    <div class="bal" id="bal">10 000</div>
  </div>

  <!-- ПОИСК СОПЕРНИКА -->
  <div class="screen active" id="sSearch">
    <div class="radar">💣</div>
    <h2 style="margin-bottom:8px">Поиск соперника...</h2>
    <p style="color:#8a8f9e; margin-bottom:24px">Ставка: <b id="betTxt" style="color:#fff">100</b></p>
    <button class="btn btn-dark" style="width:180px" onclick="cancel()">Отменить</button>
  </div>

  <!-- ИГРОВОЕ ПОЛЕ 3x3 -->
  <div class="screen" id="sGame">
    <div class="duel-bar">
      <div class="p-col"><div class="ava" id="myAva">🐯</div><b id="myName" style="font-size:13px">Игрок</b></div>
      <div style="text-align:center"><div style="font-size:11px; color:#8a8f9e">БАНК (2 МИНЫ)</div><b id="potTxt" style="color:#00ff88; font-size:17px">190</b></div>
      <div class="p-col"><div class="ava" id="enAva">🐺</div><b id="enName" style="font-size:13px">Бот</b></div>
    </div>

    <div id="turnTxt" style="font-size:19px; font-weight:800; margin-bottom:16px; min-height:26px">Ваш ход! Выберите ячейку</div>

    <div class="grid" id="grid"></div>

    <div id="endBtns" style="display:none; width:100%; flex-direction:column; align-items:center;">
      <button class="btn btn-cyan" onclick="start()">СЫГРАТЬ ЕЩЕ</button>
      <button class="btn btn-dark" onclick="location.href='index.html'">В МЕНЮ</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
    let bal = parseInt(localStorage.getItem('demo_balance')) || 10000;
    let wins = parseInt(localStorage.getItem('demo_wins')) || 0;
    let losses = parseInt(localStorage.getItem('demo_losses')) || 0;
    const bet = parseInt(localStorage.getItem('gorro_bet')) || 100;
    const myAva = localStorage.getItem('demo_avatar') || '🐯';
    const myName = tg?.initDataUnsafe?.user?.first_name || 'Игрок';

    const bots = [{ name: 'CyberWolf', ava: '🐺' }, { name: 'Shadow', ava: '🦊' }, { name: 'NeonKing', ava: '🦁' }, { name: 'Viper', ava: '🐍' }];
    let tSearch, mines = [], opened = [], myTurn = false, gameOver = false;

    document.getElementById('myAva').innerText = myAva;
    document.getElementById('myName').innerText = myName;

    function sync() {
      localStorage.setItem('demo_balance', bal);
      localStorage.setItem('demo_wins', wins);
      localStorage.setItem('demo_losses', losses);
      document.getElementById('bal').innerText = bal;
    }

    function buildGrid() {
      const g = document.getElementById('grid'); g.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const c = document.createElement('div');
        c.className = 'cell'; c.innerText = '?'; c.id = 'c' + i;
        c.onclick = () => playerClick(i);
        g.appendChild(c);
      }
    }

    function start() {
      if (bal < bet) { alert('Недостаточно средств!'); location.href = 'index.html'; return; }
      bal -= bet; sync();
      document.getElementById('betTxt').innerText = bet;
      document.getElementById('sGame').classList.remove('active');
      document.getElementById('sSearch').classList.add('active');

      tSearch = setTimeout(() => {
        const bot = bots[Math.floor(Math.random() * bots.length)];
        document.getElementById('enAva').innerText = bot.ava;
        document.getElementById('enName').innerText = bot.name;
        document.getElementById('potTxt').innerText = Math.floor(bet * 1.9);

        mines = []; opened = []; gameOver = false; myTurn = true;
        while (mines.length < 2) {
          let r = Math.floor(Math.random() * 9);
          if (!mines.includes(r)) mines.push(r);
        }
        buildGrid();
        const t = document.getElementById('turnTxt');
        t.innerText = 'Ваш ход! Выберите ячейку'; t.style.color = '#00ff88';
        document.getElementById('endBtns').style.display = 'none';
        document.getElementById('sSearch').classList.remove('active');
        document.getElementById('sGame').classList.add('active');
        tg?.HapticFeedback?.impactOccurred('medium');
      }, 2000);
    }

    function cancel() { clearTimeout(tSearch); bal += bet; sync(); location.href = 'index.html'; }

    function playerClick(idx) {
      if (!myTurn || gameOver || opened.includes(idx)) return;
      opened.push(idx);
      const cell = document.getElementById('c' + idx);
      if (mines.includes(idx)) {
        cell.classList.add('boom'); cell.innerText = '💥';
        endGame(false);
      } else {
        cell.classList.add('safe-me'); cell.innerText = '💎';
        tg?.HapticFeedback?.impactOccurred('light');
        myTurn = false;
        const t = document.getElementById('turnTxt');
        t.innerText = 'Ход соперника...'; t.style.color = '#8a8f9e';
        setTimeout(botTurn, 900);
      }
    }

    function botTurn() {
      if (gameOver) return;
      const free = [0, 1, 2, 3, 4, 5, 6, 7, 8].filter(i => !opened.includes(i));
      const pick = free[Math.floor(Math.random() * free.length)];
      opened.push(pick);
      const cell = document.getElementById('c' + pick);
      if (mines.includes(pick)) {
        cell.classList.add('boom'); cell.innerText = '💥';
        endGame(true);
      } else {
        cell.classList.add('safe-bot'); cell.innerText = '💎';
        tg?.HapticFeedback?.impactOccurred('light');
        myTurn = true;
        const t = document.getElementById('turnTxt');
        t.innerText = 'Ваш ход! Выберите ячейку'; t.style.color = '#00ff88';
      }
    }

    function endGame(isWin) {
      gameOver = true;
      mines.forEach(m => { if (!opened.includes(m)) { document.getElementById('c' + m).innerText = '💣'; } });
      const t = document.getElementById('turnTxt');
      const prize = Math.floor(bet * 1.9);
      if (isWin) {
        bal += prize; wins++;
        t.innerText = `СОПЕРНИК ПОДОРВАЛСЯ! +${prize}`; t.style.color = '#00ff88';
        tg?.HapticFeedback?.notificationOccurred('success');
      } else {
        losses++;
        t.innerText = `ВЫ ПОПАЛИ НА МИНУ! -${bet}`; t.style.color = '#ff2a5f';
        tg?.HapticFeedback?.notificationOccurred('error');
      }
      sync();
      document.getElementById('endBtns').style.display = 'flex';
    }
    sync(); start();
  </script>
</body>
</html>
