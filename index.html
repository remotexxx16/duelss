<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Онлайн Дуэль 1 на 1</title>
    <script src="https://telegram.org"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; background: #121212; color: white; }
        .app { display: flex; flex-direction: column; height: 100vh; padding: 16px; justify-content: space-between; }
        
        .scoreboard { display: flex; justify-content: space-between; align-items: center; background: #1e1e24; padding: 14px 20px; border-radius: 16px; border: 1px solid #2c2c35; }
        .player { display: flex; flex-direction: column; width: 40%; }
        .player.right { text-align: right; }
        .p-name { font-size: 14px; color: #a0a0b0; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-score { font-size: 28px; font-weight: 800; }
        .vs { font-size: 14px; font-weight: bold; color: #f1c40f; background: rgba(241, 196, 15, 0.15); padding: 6px 10px; border-radius: 8px; }

        .arena { flex: 1; margin: 16px 0; border-radius: 24px; background: #25252d; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; transition: background 0.1s; cursor: pointer; position: relative; border: 2px solid #32323e; }
        .arena.searching { background: #2c3e50; border-color: #3498db; }
        .arena.wait { background: #c0392b; border-color: #e74c3c; }
        .arena.go { background: #27ae60; border-color: #2ecc71; }
        
        .main-text { font-size: 28px; font-weight: 900; margin-bottom: 10px; letter-spacing: 0.5px; }
        .sub-text { font-size: 15px; opacity: 0.85; max-width: 260px; line-height: 1.4; }

        .action-btn { width: 100%; padding: 18px; font-size: 18px; font-weight: bold; border: none; border-radius: 16px; background: #f1c40f; color: #000; cursor: pointer; box-shadow: 0 4px 15px rgba(241, 196, 15, 0.3); }
        .action-btn:disabled { background: #333; color: #666; box-shadow: none; }
    </style>
</head>
<body>

<div class="app">
    <div class="scoreboard">
        <div class="player">
            <div class="p-name" id="my-name">Вы</div>
            <div class="p-score" id="my-score">0</div>
        </div>
        <div class="vs">1 VS 1</div>
        <div class="player right">
            <div class="p-name" id="opp-name">Ожидание...</div>
            <div class="p-score" id="opp-score">0</div>
        </div>
    </div>

    <div id="arena" class="arena">
        <div class="main-text" id="main-text">ГОТОВЫ?</div>
        <div class="sub-text" id="sub-text">Нажмите кнопку ниже, чтобы найти соперника онлайн</div>
    </div>

    <button id="action-btn" class="action-btn">НАЙТИ СОПЕРНИКА</button>
</div>

<script>
    if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('my-name').innerText = tg.initDataUnsafe.user.first_name;
        }
    }

    const nicknames = ['Alex_Pro', 'Dmitry99', 'Killa_Rus', 'Maxon', 'Shadow77', 'Sanya_Win', 'Viper', 'Artem_GG'];
    let state = 'idle';
    let roundTimer = null;
    let botTimer = null;
    let startTime = 0;
    let myScore = 0;
    let oppScore = 0;

    const arena = document.getElementById('arena');
    const mainText = document.getElementById('main-text');
    const subText = document.getElementById('sub-text');
    const actionBtn = document.getElementById('action-btn');

    actionBtn.addEventListener('click', startMatchmaking);
    arena.addEventListener('pointerdown', handleTap);

    function startMatchmaking() {
        actionBtn.style.display = 'none';
        state = 'searching';
        arena.className = 'arena searching';
        mainText.innerText = 'ПОИСК ИГРОКА...';
        subText.innerText = 'Подбираем равного соперника';
        document.getElementById('opp-name').innerText = 'Поиск...';

        setTimeout(() => {
            const randomOpp = nicknames[Math.floor(Math.random() * nicknames.length)];
            document.getElementById('opp-name').innerText = randomOpp;
            startRound();
        }, 1500);
    }

    function startRound() {
        state = 'wait';
        arena.className = 'arena wait';
        mainText.innerText = 'ЖДИТЕ ЗЕЛЕНЫЙ';
        subText.innerText = 'Не нажимайте раньше времени!';

        const delay = Math.floor(Math.random() * 2500) + 1500;
        roundTimer = setTimeout(() => {
            state = 'go';
            startTime = Date.now();
            arena.className = 'arena go';
            mainText.innerText = 'ЖМИ СЕЙЧАС!';
            subText.innerText = 'Тапай по экрану!';

            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
            }

            const oppReaction = Math.floor(Math.random() * 160) + 230;
            botTimer = setTimeout(() => {
                if (state === 'go') {
                    finishRound(false, oppReaction + ' мс (соперник быстрее)');
                }
            }, oppReaction);

        }, delay);
    }

    function handleTap() {
        if (state === 'wait') {
            clearTimeout(roundTimer);
            finishRound(false, 'Фальстарт! Вы нажали слишком рано');
        } else if (state === 'go') {
            clearTimeout(botTimer);
            const myReaction = Date.now() - startTime;
            finishRound(true, 'Ваша реакция: ' + myReaction + ' мс');
        }
    }

    function finishRound(isWin, reason) {
        state = 'idle';
        arena.className = 'arena';
        if (isWin) {
            myScore++;
            document.getElementById('my-score').innerText = myScore;
            mainText.innerText = 'ВЫ ПОБЕДИЛИ!';
            mainText.style.color = '#2ecc71';
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            }
        } else {
            oppScore++;
            document.getElementById('opp-score').innerText = oppScore;
            mainText.innerText = 'ПОРАЖЕНИЕ';
            mainText.style.color = '#e74c3c';
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
            }
        }
        subText.innerText = reason;
        actionBtn.innerText = 'ИГРАТЬ ЕЩЕ РАУНД';
        actionBtn.style.display = 'block';
        
        actionBtn.onclick = () => {
            mainText.style.color = 'white';
            actionBtn.style.display = 'none';
            startRound();
        };
    }
</script>
</body>
</html>
