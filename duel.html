<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gorro — 1V1 Reaction</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
    body { background: #0b0c10; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #1f222e; }
    .logo { font-weight: 800; font-size: 18px; color: #00f0ff; }
    .balance { background: #14161f; border: 1px solid #00ff884d; padding: 6px 14px; border-radius: 12px; color: #00ff88; font-weight: 700; }
    .screen { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .screen.active { display: flex; }
    .radar { width: 110px; height: 110px; border-radius: 50%; border: 2px solid #00f0ff; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 0 25px #00f0ff40; margin-bottom: 24px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(0.95); } 50% { transform: scale(1.08); } 100% { transform: scale(0.95); } }
    .title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .sub { color: #8a8f9e; font-size: 14px; margin-bottom: 24px; }
    .vs-box { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 340px; background: #14161f; border: 1px solid #b829ea66; border-radius: 18px; padding: 20px; margin-bottom: 20px; }
    .p-box { width: 40%; display: flex; flex-direction: column; align-items: center; }
    .ava { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #00f0ff, #b829ea); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; margin-bottom: 8px; }
    .zone { width: 100%; height: 100%; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 20px; }
    .wait { background: #1c1219; border: 2px solid #ff2a5f; }
    .go { background: #0a291b; border: 2px solid #00ff88; box-shadow: inset 0 0 50px #00ff8866; }
    .card { width: 100%; max-width: 350px; background: #14161f; border-radius: 20px; padding: 24px; border: 1px solid #ffffff14; margin-bottom: 20px; }
    .row { display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #ffffff10; font-size: 15px; }
    .btn { width: 100%; max-width: 350px; padding: 16px; border-radius: 14px; border: none; font-size: 16px; font-weight: 800; cursor: pointer; }
    .btn-cyan { background: #00f0ff; color: #05080d; margin-bottom: 12px; }
    .btn-dark { background: transparent; color: #8a8f9e; border: 1px solid #ffffff26; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡ 1V1 NEON</div>
    <div class="balance" id="bal">1 089 700</div>
  </div>

  <div class="screen active" id="sSearch">
    <div id="boxWait">
      <div class="radar">⚡</div>
      <div class="title">Поиск соперника...</div>
      <div class="sub">Ставка: <b id="betTxt" style="color:#fff">5 000</b></div>
      <button class="btn btn-dark" style="width:180px" onclick="cancel()">Отменить</button>
    </div>
    <div id="boxFound" style="display:none; width:100%; flex-direction:column; align-items:center;">
      <div class="title" style="color:#00ff88; margin-bottom:16px">СОПЕРНИК НАЙДЕН!</div>
      <div class="vs-box">
        <div class="p-box"><div class="ava" id="myAva">В</div><b id="myName">Вы</b></div>
        <div style="font-size:22px; font-weight:900; color:#b829ea">VS</div>
        <div class="p-box"><div class="ava" id="enAva" style="background:#ff2a5f">?</div><b id="enName">Бот</b></div>
      </div>
      <div class="sub">Банк дуэли: <b id="potTxt" style="color:#00ff88">9 500</b></div>
    </div>
  </div>

  <div class="screen" id="sGame">
    <div class="zone wait" id="zone" onpointerdown="tap()">
      <div style="font-size:32px; font-weight:900; margin-bottom:10px" id="zTitle">ЖДИТЕ...</div>
      <div class="sub" id="zSub" style="margin:0">Нажмите, когда экран станет зеленым</div>
    </div>
  </div>

  <div class="screen" id="sRes">
    <div class="card">
      <div style="font-size:28px; font-weight:900; margin-bottom:6px" id="rTitle">ПОБЕДА!</div>
      <div style="font-size:22px; font-weight:700; margin-bottom:18px" id="rPrize">+9 500</div>
      <div class="row"><span style="color:#8a8f9e">Ваше время:</span><b id="rMy">0 мс</b></div>
      <div class="row"><span style="color:#8a8f9e" id="rEnLbl">Соперник:</span><b id="rEn">0 мс</b></div>
    </div>
    <button class="btn btn-cyan" onclick="start()">СЫГРАТЬ ЕЩЕ</button>
    <button class="btn btn-dark" onclick="location.href='index.html'">В МЕНЮ</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
    let bal = Number(localStorage.getItem('gorro_balance')) || 1089700;
    const bet = Number(localStorage.getItem('gorro_bet')) || 5000;
    const bots = ['Alex_Pro', 'CryptoKing', 'Shadow99', 'NeonViper', 'MaxSpeed'];
    let enemy = '', t1, t2, t3, state = 'idle', startTs = 0;

    const uName = tg?.initDataUnsafe?.user?.first_name || 'Вы';
    document.getElementById('myName').textContent = uName;
    document.getElementById('myAva').textContent = uName[0].toUpperCase();

    function updBal() {
      localStorage.setItem('gorro_balance', bal);
      document.getElementById('bal').textContent = bal.toLocaleString('ru-RU');
    }
    function show(id) {
      document.querySelectorAll('.screen').forEach(e => e.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
    function start() {
      if (bal < bet) { alert('Недостаточно средств'); location.href='index.html'; return; }
      bal -= bet; updBal();
      document.getElementById('betTxt').textContent = bet.toLocaleString('ru-RU');
      document.getElementById('boxWait').style.display = 'block';
      document.getElementById('boxFound').style.display = 'none';
      show('sSearch');

      t1 = setTimeout(() => {
        enemy = bots[Math.floor(Math.random() * bots.length)];
        document.getElementById('enName').textContent = enemy;
        document.getElementById('enAva').textContent = enemy[0];
        document.getElementById('potTxt').textContent = Math.floor(bet * 1.9).toLocaleString('ru-RU');
        document.getElementById('boxWait').style.display = 'none';
        document.getElementById('boxFound').style.display = 'flex';
        tg?.HapticFeedback?.impactOccurred('medium');
        t2 = setTimeout(runGame, 1800);
      }, 2200);
    }
    function cancel() { clearTimeout(t1); clearTimeout(t2); bal += bet; updBal(); location.href='index.html'; }
    function runGame() {
      show('sGame'); state = 'wait';
      const z = document.getElementById('zone'); z.className = 'zone wait';
      document.getElementById('zTitle').textContent = 'ЖДИТЕ...';
      document.getElementById('zSub').textContent = 'Не жмите раньше времени!';
      t3 = setTimeout(() => {
        state = 'go'; startTs = performance.now(); z.className = 'zone go';
        document.getElementById('zTitle').textContent = 'ЖМИ!';
        document.getElementById('zSub').textContent = 'БЫСТРЕЕ!';
        tg?.HapticFeedback?.notificationOccurred('warning');
      }, Math.random() * 2500 + 2000);
    }
    function tap() {
      if (state === 'wait') { clearTimeout(t3); state = 'end'; finish(true, 0); }
      else if (state === 'go') { state = 'end'; finish(false, Math.round(performance.now() - startTs)); }
    }
    function finish(fStart, myMs) {
      const enMs = Math.floor(Math.random() * 110) + 195;
      const winSum = Math.floor(bet * 1.9);
      const win = !fStart && myMs < enMs;
      if (win) { bal += winSum; updBal(); tg?.HapticFeedback?.notificationOccurred('success'); }
      else { tg?.HapticFeedback?.notificationOccurred('error'); }

      const title = document.getElementById('rTitle');
      const prize = document.getElementById('rPrize');
      title.textContent = fStart ? 'ФАЛЬСТАРТ!' : (win ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ');
      title.style.color = win ? '#00ff88' : '#ff2a5f';
      prize.textContent = win ? `+${winSum.toLocaleString('ru-RU')}` : `-${bet.toLocaleString('ru-RU')}`;
      prize.style.color = win ? '#00ff88' : '#ff2a5f';
      document.getElementById('rMy').textContent = fStart ? 'Рано' : `${myMs} мс`;
      document.getElementById('rEnLbl').textContent = `Время ${enemy}:`;
      document.getElementById('rEn').textContent = `${enMs} мс`;
      show('sRes');
    }
    updBal(); start();
  </script>
</body>
</html>
